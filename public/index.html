<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LensLease — Camera &amp; Gear Rental</title>
    <meta name="description" content="Rent cinema cameras, lenses, lighting and audio gear by the day." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0b429'/%3E%3Ccircle cx='16' cy='17' r='7' fill='%23141414'/%3E%3Ccircle cx='16' cy='17' r='3' fill='%23f0b429'/%3E%3Crect x='11' y='6' width='10' height='4' rx='1.5' fill='%23141414'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <rect width="32" height="32" rx="9" fill="currentColor" />
            <circle cx="16" cy="17.5" r="7" fill="#15161a" />
            <circle cx="16" cy="17.5" r="3.1" fill="currentColor" />
            <rect x="10.5" y="5.5" width="11" height="4" rx="1.6" fill="#15161a" />
          </svg>
        </span>
        <span class="brand-text">Lens<strong>Lease</strong></span>
      </a>

      <nav class="nav" id="nav">
        <a href="#/" data-route="catalog">Catalogue</a>
        <a href="#/bookings" data-route="bookings">My rentals</a>
        <a href="#/admin" data-route="admin" class="nav-admin" hidden>Staff</a>
      </nav>

      <div class="topbar-actions">
        <button class="btn btn-ghost cart-btn" id="cart-btn" type="button">
          <span>Cart</span><span class="cart-count" id="cart-count">0</span>
        </button>
        <div id="auth-slot"></div>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="footer">
      <span>LensLease demo · data persists to <code>data/db.json</code></span>
      <span class="footer-sep">·</span>
      <span>No real payments are taken</span>
    </footer>

    <!-- Cart drawer -->
    <aside class="drawer" id="drawer" hidden aria-label="Rental cart">
      <div class="drawer-head">
        <h2>Your rental</h2>
        <button class="icon-btn" id="drawer-close" type="button" aria-label="Close cart">×</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- Sign-in dialog -->
    <dialog id="login-dialog" class="dialog">
      <form id="login-form">
        <h2>Sign in</h2>
        <p class="muted">This is a demo — pick an account, no password needed.</p>
        <div class="demo-accounts" id="demo-accounts"></div>
        <label class="field">
          <span>Email</span>
          <input type="email" id="login-email" placeholder="alex@demo.io" required />
        </label>
        <p class="form-error" id="login-error" hidden></p>
        <div class="dialog-actions">
          <button class="btn btn-ghost" id="login-cancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="login-submit" type="submit">Sign in</button>
        </div>
      </form>
    </dialog>

    <div class="toasts" id="toasts" aria-live="assertive"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
